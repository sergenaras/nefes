<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nefes Asistanı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <div class="container">
        <main class="main-content">
            
            <div class="breathing-wrapper">
                <div class="circle-visual" id="breathing-circle"></div>
            </div>

            <div class="phases-container" id="phases-container">
                </div>

            <h2 id="current-technique-title">Teknik Seçiniz</h2>
        </main>

        <aside class="sidebar">
            <h3>Nefes Teknikleri</h3>
            <div class="technique-list">
                <button onclick="setTechnique('calm')" class="tech-btn">4-7-8 (Sakinleşme)</button>
                <button onclick="setTechnique('box')" class="tech-btn">Kutu Tekniği (Odak)</button>
                <button onclick="setTechnique('energy')" class="tech-btn">Isınma (Enerji)</button>
                <button onclick="setTechnique('coherence')" class="tech-btn">Rezonans (Denge)</button>
            </div>

            <div class="info-box">
                <h4>Teknik Açıklaması</h4>
                <p id="technique-desc">
                    Lütfen bir teknik seçin.
                </p>
                <div class="technique-details" id="technique-steps"></div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
